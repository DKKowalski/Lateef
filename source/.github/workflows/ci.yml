name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      # Packaging shells out to zip, which Windows runners do not have. It is a maintainer step, not part of the product.
      - run: npm run release:prepare
        if: runner.os != 'Windows'
