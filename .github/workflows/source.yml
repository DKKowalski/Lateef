name: Test the source

on:
  push:
    branches: [main]
    paths: [source/**, .github/workflows/source.yml]
  pull_request:
    paths: [source/**, .github/workflows/source.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
